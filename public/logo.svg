<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="es-bg" cx="50%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#2a4524"/>
      <stop offset="100%" stop-color="#0c0f0a"/>
    </radialGradient>
    <linearGradient id="es-g1" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4fa832"/>
      <stop offset="100%" stop-color="#7ed957"/>
    </linearGradient>
    <linearGradient id="es-g2" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5cb83a"/>
      <stop offset="100%" stop-color="#9ef078"/>
    </linearGradient>
    <linearGradient id="es-g3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#7ed957"/>
      <stop offset="100%" stop-color="#c8ffae"/>
    </linearGradient>
    <filter id="es-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#es-bg)"/>

  <circle cx="256" cy="280" r="150" fill="#7ed957" opacity="0.06"/>

  <g filter="url(#es-glow)">
    <!-- Growth layers: save food + save money -->
    <path
      d="M256 372 L112 228 H176 L256 308 L336 228 H400 Z"
      fill="url(#es-g1)"
      opacity="0.55"
    />
    <path
      d="M256 332 L144 220 H192 L256 284 L320 220 H368 Z"
      fill="url(#es-g2)"
      opacity="0.78"
    />
    <path
      d="M256 288 L176 208 H216 L256 256 L296 208 H336 Z"
      fill="url(#es-g3)"
    />
    <!-- Leaf apex -->
    <circle cx="256" cy="192" r="22" fill="#c8ffae"/>
    <path
      d="M256 168 C228 168 210 188 220 210 C232 234 256 248 256 248 C256 248 280 234 292 210 C302 188 284 168 256 168 Z"
      fill="#9ef078"
    />
  </g>
</svg>
