<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EatSave — офлайн</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      .emoji { font-size: 48px; }
      .muted { color: #a1a1aa; font-size: 14px; max-width: 320px; }
      button {
        margin-top: 8px;
        background: #16a34a;
        color: #052e16;
        border: 0;
        border-radius: 16px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="emoji">📴</div>
      <h1>Нет соединения</h1>
      <p class="muted">EatSave временно недоступен. Проверьте интернет и попробуйте снова.</p>
      <button onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
